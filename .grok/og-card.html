<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #070605; }
  .og {
    width: 1200px;
    height: 630px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 42% 70% at 72% 50%, rgba(120, 58, 18, 0.45), transparent 70%),
      #070605;
    font-family: "Liberation Serif", "FreeSerif", serif;
    color: #f2c56e;
  }
  .card {
    position: absolute;
    top: 28px;
    right: 86px;
    height: 574px;
    width: auto;
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }
  .lockup {
    position: absolute;
    left: 78px;
    top: 168px;
    width: 620px;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: 78px;
    line-height: 0.92;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  h1 span { display: block; }
  p {
    margin: 28px 0 0;
    font-style: italic;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: #e7c2a2;
  }
  .banner {
    width: 1200px;
    height: 264px;
    position: relative;
    overflow: hidden;
    background: #070605;
    font-family: "Liberation Serif", "FreeSerif", serif;
    color: #f2c56e;
  }
  .banner .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 36% 140% at 78% 42%, rgba(140, 64, 18, 0.5), transparent 72%);
  }
  .banner .card {
    top: -70px;
    right: 48px;
    height: 760px;
    border-radius: 8px;
    box-shadow: none;
  }
  .banner .lockup {
    left: 64px;
    top: 42px;
    width: 560px;
  }
  .banner h1 { font-size: 46px; letter-spacing: 0.06em; }
  .banner p { margin-top: 14px; font-size: 18px; }
</style>
</head>
<body>
  <div class="og" id="og">
    <img class="card" src="file:///workspace/public/card-back-velomere.jpg" alt="" />
    <div class="lockup">
      <h1><span>The Threshold</span><span>of Solace</span></h1>
      <p>Sit with what returns</p>
    </div>
  </div>
  <div class="banner" id="banner">
    <div class="glow"></div>
    <img class="card" src="file:///workspace/public/card-back-velomere.jpg" alt="" />
    <div class="lockup">
      <h1><span>The Threshold</span><span>of Solace</span></h1>
      <p>Sit with what returns</p>
    </div>
  </div>
</body>
</html>
